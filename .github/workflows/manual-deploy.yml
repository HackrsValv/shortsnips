name: Validate or deploy The Snip Report
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy only after owner approval, reviewed config and secrets'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: snip-report-worker
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
  deploy:
    if: ${{ inputs.deploy }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reject unresolved setup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SPIRAL_TOKEN: ${{ secrets.SPIRAL_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NOTION_SETUP_TOKEN: ${{ secrets.NOTION_SETUP_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          for (const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','NOTION_TOKEN','BUTTONDOWN_API_KEY','SPIRAL_TOKEN','ADMIN_TOKEN','NOTION_SETUP_TOKEN']) {
            if (!process.env[key]) throw new Error(`Missing ${key}`);
          }
          const config = fs.readFileSync('wrangler.jsonc','utf8');
          if (config.includes('REPLACE_WITH_DATA_SOURCE_ID') || config.includes('REPLACE_WITH_WORKSPACE_ID')) throw new Error('Verify actual Notion data source/workspace before deploy');
          if (!config.includes('"ALLOW_REVIEWED_SEND": "false"')) throw new Error('This workflow is draft-only');
          JS
      - name: Deploy code (bootstrap accepts no unsigned content events)
        run: npx wrangler deploy
      - name: Install runtime secrets through stdin, never logs or committed files
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SPIRAL_TOKEN: ${{ secrets.SPIRAL_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NOTION_SETUP_TOKEN: ${{ secrets.NOTION_SETUP_TOKEN }}
          NOTION_WEBHOOK_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
        run: |
          node --input-type=module <<'JS' | npx wrangler secret bulk
          const keys=['NOTION_TOKEN','BUTTONDOWN_API_KEY','SPIRAL_TOKEN','ADMIN_TOKEN','NOTION_SETUP_TOKEN','NOTION_WEBHOOK_SECRET'];
          const values=Object.fromEntries(keys.filter(k=>process.env[k]).map(k=>[k,process.env[k]]));
          process.stdout.write(JSON.stringify(values));
          JS
